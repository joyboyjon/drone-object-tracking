<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Drone tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1e1e1e; color: #ddd; margin: 20px; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    #status { margin-bottom: 10px; color: #8f8; }
    #controls { margin-bottom: 10px; }
    button { padding: 6px 14px; margin-right: 6px; cursor: pointer; }
    #video { max-width: 100%; border: 1px solid #555; cursor: crosshair; }
    #console { height: 200px; overflow-y: auto; background: #000; padding: 8px;
               font-family: Consolas, monospace; font-size: 13px;
               white-space: pre; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Drone tracker - panou de control</h1>
  <div id="controls">
    <button onclick="sendControl('start')">Start / Continua</button>
    <button onclick="sendControl('pause')">Pauza</button>
    <button onclick="sendControl('restart')">Reia testul</button>
  </div>
  <div id="status">Se incarca...</div>
  <img id="video" src="/video" alt="Imagine live">
  <div id="console"></div>

  <script>
    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");
    const consoleBox = document.getElementById("console");

    // Butoanele de test: trimit comanda la server
    function sendControl(action) {
      fetch("/control", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: action }),
      });
    }

    // Click pe imagine: transformam pozitia din pagina in pixeli ai imaginii
    video.addEventListener("click", (event) => {
      const rect = video.getBoundingClientRect();
      const x = (event.clientX - rect.left) * video.naturalWidth / rect.width;
      const y = (event.clientY - rect.top) * video.naturalHeight / rect.height;
      fetch("/click", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ x: x, y: y }),
      });
    });

    // La fiecare 0.5 secunde cerem starea si mesajele de la server
    async function refresh() {
      try {
        const response = await fetch("/status");
        const data = await response.json();
        const s = data.status;
        const mode = data.running ? "RULEAZA" : "PAUZA";
        statusBox.textContent =
          `[${mode}] FPS: ${s.fps} | Obiecte: ${s.objects} | Cadru: ${s.frame} | ${s.target} ${s.motion}`;

        const atBottom = consoleBox.scrollTop + consoleBox.clientHeight
                         >= consoleBox.scrollHeight - 5;
        consoleBox.textContent = data.events.join("\n");
        if (atBottom) consoleBox.scrollTop = consoleBox.scrollHeight;
      } catch (error) {
        statusBox.textContent = "Fara conexiune cu serverul";
      }
    }
    setInterval(refresh, 500);
  </script>
</body>
</html>
